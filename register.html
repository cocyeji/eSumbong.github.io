<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | Community Reporting System</title><link rel="stylesheet" href="css/style.css"></head>
<body data-page="register" data-role=""><nav id="nav"></nav><main>
<h1>Resident Registration</h1><form class="box"><div id="msg" class="msg"></div><label>Full Name</label><input name="fullName" required minlength="2" maxlength="50"><label>Address</label><input name="address" required><label>Contact Number</label><input name="contactNumber" required pattern="[0-9]{10,11}" title="10 to 11 digits"><label>Username</label><input name="username" required minlength="4" maxlength="20"><label>Password</label><input type="password" name="password" required minlength="6"><button>Create Account</button></form>
</main><footer>&copy; 2026 Community Reporting System</footer><script src="js/app.js"></script></body></html>
